<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1677ff">
<link rel="icon" href="./assets/cpo-app-icon.svg" type="image/svg+xml">
<title>CPO Supply Chain</title>
<meta name="description" content="CPO 및 Silicon Photonics 공급망 탐색 도구">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f8fc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#loading{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#f4f8fc;color:#496985;text-align:center;padding:24px}
#loading b{display:block;color:#172a3f;font-size:20px;margin-bottom:8px}
#loading span{font-size:13px;line-height:1.6}
#fallback{display:inline-block;margin-top:14px;padding:9px 14px;border-radius:999px;background:#1677ff;color:white;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<div id="loading"><div><b>CPO Supply Chain</b><span>보호된 애플리케이션을 불러오고 있습니다.</span><br><a id="fallback" href="https://cpo-supply-chain.onrender.com/">직접 열기</a></div></div>
<iframe id="app" title="CPO Supply Chain" src="https://cpo-supply-chain.onrender.com/" referrerpolicy="strict-origin-when-cross-origin" allow="clipboard-write; fullscreen"></iframe>
<script>
(function(){
  var frame=document.getElementById('app'),loading=document.getElementById('loading');
  frame.addEventListener('load',function(){loading.style.display='none'});
  if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})}).catch(function(){})}
  if('caches' in window){caches.keys().then(function(keys){return Promise.all(keys.map(function(k){return caches.delete(k)}))}).catch(function(){})}
})();
</script>
</body>
</html>
